<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfrAlert - Funcionario</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <nav class="navbar bg-white border-bottom mb-4">
    <div class="container">
      <span class="navbar-brand mb-0 h1">InfrAlert</span>
      <div class="d-flex align-items-center gap-3">
        <span id="saludo" class="text-muted"></span>
        <button id="btn-salir" type="button" class="btn btn-outline-secondary btn-sm">Cerrar sesión</button>
      </div>
    </div>
  </nav>

  <main class="container pb-5">
    <div id="mensaje" class="alert d-none" role="alert"></div>
    <div class="row g-4">
      <section class="col-lg-6">
        <h2 class="h5 mb-3">Mi reporte en proceso</h2>
        <div id="mio"></div>
      </section>
      <section class="col-lg-6">
        <h2 class="h5 mb-3">Reportes sin asignar</h2>
        <div id="sin-asignar"></div>
      </section>
    </div>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script>
    const usuario = usuarioActual();

    const ESTILO_ESTADO = { PENDIENTE: "warning", EN_PROCESO: "info", RESUELTO: "success", CANCELADO: "secondary" };
    const TEXTO_ESTADO = { PENDIENTE: "Pendiente", EN_PROCESO: "En proceso", RESUELTO: "Resuelto", CANCELADO: "Cancelado" };

    function el(etiqueta, clase, texto) {
      const nodo = document.createElement(etiqueta);
      if (clase) nodo.className = clase;
      if (texto !== undefined) nodo.textContent = texto;
      return nodo;
    }

    function mostrarMensaje(texto, tipo) {
      const caja = document.getElementById("mensaje");
      caja.className = "alert alert-" + tipo;
      caja.textContent = texto;
    }

    function ocultarMensaje() {
      document.getElementById("mensaje").className = "alert d-none";
    }

    function tarjeta(r, botones) {
      const t = el("div", "card shadow-sm mb-3");
      const cuerpo = el("div", "card-body");
      const cab = el("div", "d-flex justify-content-between align-items-start mb-2");
      cab.appendChild(el("h3", "h6 mb-0", r.titulo));
      cab.appendChild(el("span", "badge text-bg-" + (ESTILO_ESTADO[r.estado] || "secondary"),
                         TEXTO_ESTADO[r.estado] || r.estado));
      cuerpo.appendChild(cab);
      cuerpo.appendChild(el("p", "mb-2", r.descripcion));
      const fecha = new Date(r.fechaCreacion).toLocaleDateString("es-CO");
      cuerpo.appendChild(el("small", "text-muted d-block mb-2",
        (r.categoria ? r.categoria.nombre : "Sin categoría") + " · " + r.ubicacion + " · " + fecha));
      if (botones.length) {
        const fila = el("div", "d-flex gap-2");
        botones.forEach(b => fila.appendChild(b));
        cuerpo.appendChild(fila);
      }
      t.appendChild(cuerpo);
      return t;
    }

    function boton(texto, clase, accion) {
      const b = el("button", "btn btn-sm " + clase, texto);
      b.type = "button";
      b.addEventListener("click", async () => {
        b.disabled = true;
        ocultarMensaje();
        try {
          await accion();
        } catch (err) {
          mostrarMensaje(err.message, "danger"); // se muestra el error tal como lo devuelva la API
        }
        await cargar();
      });
      return b;
    }

    async function cargar() {
      const mio = document.getElementById("mio");
      const libres = document.getElementById("sin-asignar");
      mio.replaceChildren();
      libres.replaceChildren();
      try {
        const propios = (await listarReportesDeFuncionario(usuario.funcionarioId))
          .filter(r => r.estado === "EN_PROCESO");
        if (propios.length === 0) {
          mio.appendChild(el("p", "text-muted", "No tienes un reporte en proceso."));
        }
        propios.forEach(r => mio.appendChild(tarjeta(r, [
          boton("Marcar como resuelto", "btn-success", () => cambiarEstado(r.id, "RESUELTO")),
          boton("Cancelar", "btn-outline-danger", () => cambiarEstado(r.id, "CANCELADO"))
        ])));

        const sinAsignar = await listarSinAsignar();
        if (sinAsignar.length === 0) {
          libres.appendChild(el("p", "text-muted", "No hay reportes sin asignar."));
        }
        sinAsignar.forEach(r => libres.appendChild(tarjeta(r, [
          boton("Tomar reporte", "btn-primary", () => tomarReporte(r.id, usuario.funcionarioId))
        ])));
      } catch (err) {
        mostrarMensaje(err.message, "danger");
      }
    }

    // Esta revisión solo evita errores visuales; la seguridad real debe estar en el backend.
    if (!usuario || usuario.rol !== "funcionario") {
      window.location.href = "index.html";
    } else {
      document.getElementById("saludo").textContent = "Hola, " + usuario.nombre;
      document.getElementById("btn-salir").addEventListener("click", cerrarSesion);
      cargar();
    }
  </script>
</body>
</html>
