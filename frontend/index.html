<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>InfrAlert - Ingreso</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container" style="max-width: 420px; margin-top: 10vh;">
    <h1 class="h3 text-center mb-4">InfrAlert</h1>
    <form id="form-login" class="card card-body shadow-sm">
      <div class="mb-3">
        <label for="correo" class="form-label">Correo</label>
        <input type="email" id="correo" class="form-control" required>
      </div>
      <div class="mb-3">
        <label for="contrasena" class="form-label">Contraseña</label>
        <input type="password" id="contrasena" class="form-control" required>
      </div>
      <div id="error" class="alert alert-danger d-none" role="alert"></div>
      <button type="submit" class="btn btn-primary w-100">Ingresar</button>
    </form>
  </main>

  <script src="js/mock-data.js"></script>
  <script src="js/api.js"></script>
  <script>
    const DESTINO = {
      ciudadano: "ciudadano.html",
      funcionario: "funcionario.html",
      administrador: "admin.html"
    };
    document.getElementById("form-login").addEventListener("submit", async (e) => {
      e.preventDefault();
      const caja = document.getElementById("error");
      caja.classList.add("d-none");
      try {
        const u = await login(
          document.getElementById("correo").value,
          document.getElementById("contrasena").value
        );
        window.location.href = DESTINO[u.rol] || "index.html";
      } catch (err) {
        caja.textContent = err.message;
        caja.classList.remove("d-none");
      }
    });
  </script>
</body>
</html>
